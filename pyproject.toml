[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs6727-secure-model-delegation"
version = "0.2.0"
description = "Local-first AI application and preserved model-delegation research evaluator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "platformdirs>=4,<5",
    "zstandard>=0.23,<1",
]

[project.scripts]
smd = "smd_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["smd_app*"]

[tool.setuptools.package-data]
smd_app = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
