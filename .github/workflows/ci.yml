name: Application and preserved research validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  historical-evaluation:
    name: Historical simulated evaluation at 4706804
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: 47068049ad690950c0f516955960e0b3a1aebba2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Regenerate deterministic benchmark artifacts
        run: python scripts/generate_smd_bench.py

      - name: Verify checked-in benchmark artifacts are reproducible
        run: >-
          git diff --exit-code --
          data/smd_bench_112_development_pilot.jsonl
          data/smd_bench_1400.jsonl
          data/smd_bench_1400_manifest.json
          data/smd_challenge_210.jsonl
          data/smd_challenge_210_manifest.json
          data/smd_egress_challenge_36.jsonl
          data/smd_egress_challenge_36_manifest.json
          data/review

      - name: Verify post-freeze controller integrity
        run: python scripts/check_controller_freeze.py

      - name: Evaluate the 112-case development pilot without external APIs
        run: >-
          python scripts/run_eval.py
          --dataset data/smd_bench_112_development_pilot.jsonl
          --run-dir runs/ci-pilot
          --output runs/ci-pilot/report.json
          --benchmark-name SMD-Bench-112-development-pilot
          --summary-only

      - name: Evaluate SMD-Bench-1400
        run: >-
          python scripts/run_eval.py
          --dataset data/smd_bench_1400.jsonl
          --run-dir runs/ci-main
          --output runs/ci-main/report.json
          --benchmark-name SMD-Bench-1400
          --summary-only

      - name: Evaluate main utility-weight sensitivity
        run: >-
          python scripts/run_utility_sensitivity.py
          --report runs/ci-main/report.json
          --output runs/ci-main/utility-sensitivity.json

      - name: Smoke test local web UI and simulated endpoint
        run: python scripts/smoke_web.py

      - name: Evaluate the post-freeze challenge set
        run: >-
          python scripts/run_eval.py
          --dataset data/smd_challenge_210.jsonl
          --run-dir runs/ci-challenge
          --output runs/ci-challenge/report.json
          --benchmark-name SMD-Challenge-210
          --summary-only

      - name: Evaluate challenge utility-weight sensitivity
        run: >-
          python scripts/run_utility_sensitivity.py
          --report runs/ci-challenge/report.json
          --output runs/ci-challenge/utility-sensitivity.json

      - name: Evaluate the egress challenge set
        run: >-
          python scripts/run_eval.py
          --dataset data/smd_egress_challenge_36.jsonl
          --run-dir runs/ci-egress-challenge
          --output runs/ci-egress-challenge/report.json
          --benchmark-name SMD-Egress-Challenge-36
          --summary-only

      - name: Validate pending human-review agreement workflow
        run: python scripts/summarize_human_review.py --output docs/evidence/pr4/20-human-review-agreement.json

  live-application:
    name: Live application (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install editable application
        run: python -m pip install -e . build
      - name: Test application with local model and provider doubles
        run: python -m unittest discover -s tests -p 'test_app_*.py' -v
      - name: Test desktop protocol and runtime adapters without downloads
        run: |
          python -m unittest discover -s tests -p 'test_agent_gateway.py' -v
          python -m unittest discover -s tests -p 'test_mlx_runtime.py' -v
          python -m unittest discover -s tests -p 'test_model_downloads.py' -v
          python -m unittest discover -s tests -p 'test_desktop_lifecycle.py' -v
      - name: Build installable wheel and source package
        run: python -m build
      - name: Confirm application did not change preserved research inputs
        run: >-
          git diff --exit-code eb48dc0752800920b218b08517aed08a85b93bd6 --
          src/smd_gateway src/smd_bench configs benchmark data paper
      - name: Explain historical reference
        shell: bash
        run: |
          echo 'Historical validation checks out 4706804; it does not certify the current application as the frozen controller.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Before application development, HEAD already differed from d1d13cd in configs/policy.yaml (advisory ML notes) and policy.py (rule name).' >> "$GITHUB_STEP_SUMMARY"
          echo 'Application tests use doubles and make no paid provider calls or multi-GB model downloads.' >> "$GITHUB_STEP_SUMMARY"

  desktop-interface:
    name: aethon desktop interface and lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - name: Check lifecycle and restricted desktop interfaces
        run: node --test desktop/tests/*.test.cjs
      - name: Build bundled canvas and document preview assets
        run: |
          npm ci --prefix frontend --no-audit --no-fund
          npm run --prefix frontend build
      - name: Check application scripts
        run: |
          node --check src/smd_app/static/app.js
          node --check src/smd_app/static/desktop.js

  required-application-checks:
    name: Required application checks
    if: ${{ always() }}
    needs: [historical-evaluation, live-application, desktop-interface]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every application check to succeed
        env:
          HISTORICAL_RESULT: ${{ needs.historical-evaluation.result }}
          APPLICATION_RESULT: ${{ needs.live-application.result }}
          DESKTOP_RESULT: ${{ needs.desktop-interface.result }}
        run: |
          for result in "$HISTORICAL_RESULT" "$APPLICATION_RESULT" "$DESKTOP_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "A required application check did not succeed: $result"
              exit 1
            fi
          done
